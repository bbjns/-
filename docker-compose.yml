version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/data/database.sqlite
      - JWT_SECRET=your-secret-key-change-in-production
    volumes:
      - server-data:/data
    networks:
      - app-network

volumes:
  server-data:

networks:
  app-network:
    driver: bridge
